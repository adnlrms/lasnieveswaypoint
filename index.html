<section><h4>Who we are</h4><p><b>${u(org)}</b> of the Department of Education is responsible for the personal information in ${u(CONFIG.SUB_TITLE)}. The board records where district personnel are during official working days.</p></section>
<section><h4>What we collect</h4><ul>
